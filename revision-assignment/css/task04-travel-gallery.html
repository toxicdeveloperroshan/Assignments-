<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Travel Destination Gallery</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#10202e;padding:30px}
h1{color:#fff;text-align:center;margin-bottom:25px}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:15px}
.item{position:relative;overflow:hidden;border-radius:10px;height:220px}
.item img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.item:hover img{transform:scale(1.2)}
.overlay{position:absolute;inset:0;background:rgba(0,0,0,.6);color:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;opacity:0;transition:opacity .4s}
.item:hover .overlay{opacity:1}
.overlay h3{margin-bottom:5px}
</style>
</head>
<body>
<h1>Travel Destination Gallery</h1>
<div class="gallery">
  <div class="item"><img src="https://placehold.co/400x300?text=Goa" alt="Goa"><div class="overlay"><h3>Goa</h3><p>Beaches and nightlife</p></div></div>
  <div class="item"><img src="https://placehold.co/400x300?text=Jaipur" alt="Jaipur"><div class="overlay"><h3>Jaipur</h3><p>Forts and palaces</p></div></div>
  <div class="item"><img src="https://placehold.co/400x300?text=Manali" alt="Manali"><div class="overlay"><h3>Manali</h3><p>Snow and mountains</p></div></div>
  <div class="item"><img src="https://placehold.co/400x300?text=Kerala" alt="Kerala"><div class="overlay"><h3>Kerala</h3><p>Backwaters</p></div></div>
  <div class="item"><img src="https://placehold.co/400x300?text=Nashik" alt="Nashik"><div class="overlay"><h3>Nashik</h3><p>Temples and vineyards</p></div></div>
  <div class="item"><img src="https://placehold.co/400x300?text=Ladakh" alt="Ladakh"><div class="overlay"><h3>Ladakh</h3><p>High-altitude lakes</p></div></div>
</div>
</body>
</html>
