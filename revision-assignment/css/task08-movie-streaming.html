<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Movie Streaming</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#141414;color:#fff}
header{padding:15px 30px;background:#000;display:flex;justify-content:space-between;align-items:center}
header h2{color:#e50914}
.banner{height:55vh;background:linear-gradient(to right,rgba(0,0,0,.85),transparent),url('https://placehold.co/1200x500?text=Featured+Movie') center/cover;display:flex;flex-direction:column;justify-content:center;padding:40px}
.banner h1{font-size:44px;margin-bottom:10px}
.banner p{max-width:420px;margin-bottom:18px;color:#ddd}
.banner button{width:130px;padding:12px;border:none;border-radius:5px;background:#e50914;color:#fff;font-size:16px;cursor:pointer}
.banner button:hover{background:#b20710}
.category{padding:20px 30px}
.category h2{margin-bottom:12px}
.row{display:flex;gap:15px;overflow-x:auto;padding-bottom:10px}
.movie{position:relative;flex:0 0 160px;height:230px;border-radius:8px;overflow:hidden}
.movie img{width:100%;height:100%;object-fit:cover}
.movie .info{position:absolute;inset:0;background:rgba(0,0,0,.75);display:flex;justify-content:center;align-items:center;text-align:center;opacity:0;transition:opacity .3s}
.movie:hover .info{opacity:1}
@media(max-width:600px){.banner h1{font-size:28px}.movie{flex-basis:120px;height:170px}}
</style>
</head>
<body>
<header><h2>STREAMFLIX</h2><span>Home | Movies | Series | My List</span></header>
<div class="banner"><h1>The Great Adventure</h1><p>A thrilling journey across the world to find a lost treasure.</p><button>Play</button></div>
<div class="category"><h2>Trending Now</h2><div class="row">
  <div class="movie"><img src="https://placehold.co/160x230?text=Movie+1" alt=""><div class="info">Movie 1</div></div>
  <div class="movie"><img src="https://placehold.co/160x230?text=Movie+2" alt=""><div class="info">Movie 2</div></div>
  <div class="movie"><img src="https://placehold.co/160x230?text=Movie+3" alt=""><div class="info">Movie 3</div></div>
  <div class="movie"><img src="https://placehold.co/160x230?text=Movie+4" alt=""><div class="info">Movie 4</div></div>
  <div class="movie"><img src="https://placehold.co/160x230?text=Movie+5" alt=""><div class="info">Movie 5</div></div>
  <div class="movie"><img src="https://placehold.co/160x230?text=Movie+6" alt=""><div class="info">Movie 6</div></div>
</div></div>
<div class="category"><h2>Action</h2><div class="row">
  <div class="movie"><img src="https://placehold.co/160x230?text=Action+1" alt=""><div class="info">Action 1</div></div>
  <div class="movie"><img src="https://placehold.co/160x230?text=Action+2" alt=""><div class="info">Action 2</div></div>
  <div class="movie"><img src="https://placehold.co/160x230?text=Action+3" alt=""><div class="info">Action 3</div></div>
  <div class="movie"><img src="https://placehold.co/160x230?text=Action+4" alt=""><div class="info">Action 4</div></div>
  <div class="movie"><img src="https://placehold.co/160x230?text=Action+5" alt=""><div class="info">Action 5</div></div>
</div></div>
</body>
</html>
