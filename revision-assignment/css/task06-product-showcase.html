<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Showcase</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#f4f4f4;padding:30px}
h1{text-align:center;margin-bottom:30px}
.products{display:flex;flex-wrap:wrap;gap:25px;justify-content:center}
.product{position:relative;width:240px;background:#fff;border-radius:12px;padding:15px;text-align:center;box-shadow:0 3px 10px rgba(0,0,0,.12);transition:transform .3s,box-shadow .3s}
.product:hover{transform:translateY(-8px) scale(1.03);box-shadow:0 12px 24px rgba(0,0,0,.2)}
.product img{width:100%;border-radius:8px}
.badge{position:absolute;top:10px;left:10px;background:#e91e63;color:#fff;padding:4px 10px;border-radius:20px;font-size:12px}
.badge.new{background:#4caf50}
.discount{position:absolute;top:10px;right:10px;background:#ff9800;color:#fff;padding:4px 8px;border-radius:6px;font-size:12px}
.product h3{margin:12px 0 5px}
.old{text-decoration:line-through;color:#999;margin-right:6px}
.new-price{color:#e91e63;font-weight:bold;font-size:18px}
.product button{margin-top:12px;padding:10px 22px;border:none;border-radius:20px;background:#222;color:#fff;cursor:pointer;transition:background .3s,transform .2s}
.product button:hover{background:#e91e63;transform:scale(1.08)}
</style>
</head>
<body>
<h1>Product Showcase</h1>
<div class="products">
  <div class="product"><span class="badge">Hot</span><span class="discount">-30%</span><img src="https://placehold.co/220x180?text=Headphones" alt=""><h3>Headphones</h3><p><span class="old">Rs. 2000</span><span class="new-price">Rs. 1400</span></p><button>Add to Cart</button></div>
  <div class="product"><span class="badge new">New</span><span class="discount">-10%</span><img src="https://placehold.co/220x180?text=Smart+Watch" alt=""><h3>Smart Watch</h3><p><span class="old">Rs. 3500</span><span class="new-price">Rs. 3150</span></p><button>Add to Cart</button></div>
  <div class="product"><span class="badge">Sale</span><span class="discount">-50%</span><img src="https://placehold.co/220x180?text=Backpack" alt=""><h3>Backpack</h3><p><span class="old">Rs. 1600</span><span class="new-price">Rs. 800</span></p><button>Add to Cart</button></div>
  <div class="product"><span class="badge new">New</span><span class="discount">-20%</span><img src="https://placehold.co/220x180?text=Sneakers" alt=""><h3>Sneakers</h3><p><span class="old">Rs. 2500</span><span class="new-price">Rs. 2000</span></p><button>Add to Cart</button></div>
</div>
</body>
</html>
