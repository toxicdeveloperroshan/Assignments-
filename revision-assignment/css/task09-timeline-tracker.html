<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Timeline and Progress Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#eef2f7;padding:40px 20px}
h1{text-align:center;margin-bottom:25px}
.progress{max-width:600px;margin:0 auto 40px;background:#d5dbe5;border-radius:20px;overflow:hidden}
.bar{height:22px;width:0;background:#3f8efc;color:#fff;font-size:13px;text-align:center;line-height:22px;animation:fill 2.5s forwards}
@keyframes fill{to{width:70%}}
.timeline{position:relative;max-width:600px;margin:auto;padding-left:30px;border-left:4px solid #3f8efc}
.milestone{position:relative;background:#fff;padding:18px;margin-bottom:25px;border-radius:10px;box-shadow:0 3px 8px rgba(0,0,0,.12);opacity:0;transform:translateX(-30px);animation:slide .6s forwards}
.milestone::before{content:"";position:absolute;left:-43px;top:22px;width:18px;height:18px;border-radius:50%;background:#fff;border:4px solid #3f8efc}
.milestone.done::before{background:#3f8efc}
.milestone:nth-child(1){animation-delay:.2s}.milestone:nth-child(2){animation-delay:.6s}.milestone:nth-child(3){animation-delay:1s}.milestone:nth-child(4){animation-delay:1.4s}
@keyframes slide{to{opacity:1;transform:translateX(0)}}
.milestone:hover{transform:scale(1.03);transition:transform .3s}
.milestone small{color:#3f8efc}
</style>
</head>
<body>
<h1>Project Timeline</h1>
<div class="progress"><div class="bar">70%</div></div>
<div class="timeline">
  <div class="milestone done"><small>October 2026</small><h3>Planning</h3><p>Requirements collected and plan ready.</p></div>
  <div class="milestone done"><small>November 2026</small><h3>Design</h3><p>Page layouts and colour theme finalised.</p></div>
  <div class="milestone done"><small>December 2026</small><h3>Development</h3><p>Pages built with HTML, CSS and Bootstrap.</p></div>
  <div class="milestone"><small>January 2027</small><h3>Launch</h3><p>Testing and final deployment.</p></div>
</div>
</body>
</html>
