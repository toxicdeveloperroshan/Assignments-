<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Admission Portal</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
  <div class="container">
    <a class="navbar-brand" href="#">Sahyadri College</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="menu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link active" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Courses</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Admission</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
      </ul>
    </div>
  </div>
</nav>

<div class="container my-5">
  <div class="card shadow">
    <div class="card-header bg-primary text-white"><h4 class="mb-0">Student Admission Form</h4></div>
    <div class="card-body">
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">First Name</label>
            <input type="text" class="form-control" placeholder="Enter first name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Last Name</label>
            <input type="text" class="form-control" placeholder="Enter last name" required>
          </div>
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <div class="input-group">
              <span class="input-group-text">@</span>
              <input type="email" class="form-control" placeholder="student@example.com" required>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Phone</label>
            <div class="input-group">
              <span class="input-group-text">+91</span>
              <input type="tel" class="form-control" placeholder="10-digit number" required>
            </div>
          </div>
          <div class="col-md-6">
            <label class="form-label">Course</label>
            <select class="form-select">
              <option selected>Select course</option>
              <option>Computer Engineering</option>
              <option>Information Technology</option>
              <option>Mechanical Engineering</option>
              <option>Civil Engineering</option>
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Category</label>
            <select class="form-select">
              <option selected>Select category</option>
              <option>Open</option><option>OBC</option><option>SC</option><option>ST</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Address</label>
            <textarea class="form-control" rows="3" placeholder="Enter address"></textarea>
          </div>
          <div class="col-12">
            <label class="form-label d-block">Documents Submitted</label>
            <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="d1"><label class="form-check-label" for="d1">10th Marksheet</label></div>
            <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="d2"><label class="form-check-label" for="d2">12th Marksheet</label></div>
            <div class="form-check form-check-inline"><input class="form-check-input" type="checkbox" id="d3"><label class="form-check-label" for="d3">Aadhaar Card</label></div>
          </div>
          <div class="col-12">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="agree" required>
              <label class="form-check-label" for="agree">I confirm that the above details are correct.</label>
            </div>
          </div>
          <div class="col-12">
            <button type="submit" class="btn btn-primary px-4">Submit Application</button>
            <button type="reset" class="btn btn-outline-secondary">Reset</button>
          </div>
        </div>
      </form>
    </div>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
