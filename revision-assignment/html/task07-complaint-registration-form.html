<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Complaint Registration Form</title>
</head>
<body>
<h1>Online Complaint Registration Form</h1>
<form action="#" method="post" enctype="multipart/form-data">
  <p><label>Name: <input type="text" name="name" required></label></p>
  <p><label>Email: <input type="email" name="email" required></label></p>
  <p><label>Phone: <input type="tel" name="phone" required></label></p>
  <p><label>Complaint Category:
    <select name="category">
      <option>Service</option><option>Product</option><option>Billing</option><option>Staff Behaviour</option><option>Other</option>
    </select></label></p>
  <p>Priority:
    <label><input type="radio" name="priority" value="low"> Low</label>
    <label><input type="radio" name="priority" value="medium" checked> Medium</label>
    <label><input type="radio" name="priority" value="high"> High</label></p>
  <p><label>Complaint Description:<br>
    <textarea name="description" rows="5" cols="40" placeholder="Describe your complaint"></textarea></label></p>
  <p><label>Attachment: <input type="file" name="attachment"></label></p>
  <p><label>Preferred Resolution Date: <input type="date" name="resolution"></label></p>
  <p><input type="submit" value="Submit Complaint"> <input type="reset"></p>
</form>
</body>
</html>
